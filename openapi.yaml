openapi: 3.0.0
info:
  title: WMMS API
  version: 1.0.0
  description: Waste Management Management System API documentation
servers:
  - url: http://localhost:4500
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: API is healthy

  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid credentials

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
                - name
                - email
                - password
      responses:
        '201':
          description: User registered
        '400':
          description: Invalid input

  /users:
    get:
      summary: Get all users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

  /waste-collections:
    get:
      summary: Get all waste collections
      responses:
        '200':
          description: List of waste collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WasteCollection'

    post:
      summary: Create a new waste collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WasteCollection'
      responses:
        '201':
          description: Waste collection created

  /waste-collections/{id}:
    get:
      summary: Get waste collection by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Waste collection found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WasteCollection'
        '404':
          description: Not found

  /reports:
    get:
      summary: Get all reports
      responses:
        '200':
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'

    post:
      summary: Create a new report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
      responses:
        '201':
          description: Report created

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email

    WasteCollection:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        date:
          type: string
          format: date
        status:
          type: string
          enum: [pending, completed, cancelled]

    Report:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
